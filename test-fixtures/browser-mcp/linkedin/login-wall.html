<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Sign in | LinkedIn</title>
  </head>
  <body>
    <main>
      <form class="login__form" action="/login-submit">
        <label for="session_key">Email</label>
        <input id="session_key" type="email" name="session_key" autocomplete="username" />
        <label for="session_password">Password</label>
        <input id="session_password" type="password" name="session_password" />
        <button type="submit">Sign in</button>
      </form>
    </main>
  </body>
</html>
