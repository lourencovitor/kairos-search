services:
  - type: web
    name: kairos
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm run build && pnpm run build:prod
    startCommand: NODE_ENV=production node_modules/.bin/tsx src/job-research-agent/web/server.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: DISABLE_BROWSER
        value: "true"
      # AdSense — preencha após aprovação
      # - key: VITE_ADSENSE_CLIENT
      #   value: ca-pub-XXXXXXXXXXXXXXXX
